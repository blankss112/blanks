<!DOCTYPE html>
<html lang="ru">
<head>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>blanks — minimal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F7F4;--ink:#171717;--mute:#858585;--line:#E8E7E3;color-scheme:light}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;min-height:0;background:var(--line);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;transition:transform .15s,opacity .2s}
button:active{transform:scale(.97);opacity:.8}
.app{
  position:relative;
  width:100%;
  max-width:430px;
  height:100%;
  min-height:0;
  margin:0 auto;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.top{height:56px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);flex:none;padding-top:env(safe-area-inset-top,0px)}
.logo{font-size:18px;font-weight:500;letter-spacing:-.04em}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:20px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.fade{animation:fade .45s cubic-bezier(.2,.7,.2,1)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pad{padding:0 20px}
.img{position:relative;background:var(--line);overflow:hidden}
.img svg{position:absolute;inset:12% 10% 10%;width:80%;height:78%}
.hero{margin:20px 20px 0;aspect-ratio:4/5}
.hero svg{inset:10%;width:80%;height:80%}
.lead{padding:20px 20px 0;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.lead small{display:block;font-size:11px;color:var(--mute);margin-bottom:5px;letter-spacing:.04em}
.lead h1{font-weight:400;font-size:18px;letter-spacing:-.01em}
.btn{display:block;width:100%;padding:16px;background:var(--ink);color:var(--bg);font-size:13px;letter-spacing:.04em;font-weight:400;border-radius:2px;text-align:center}
.link{font-size:13px;border-bottom:1px solid var(--ink);padding-bottom:2px;white-space:nowrap}
.sec{padding:64px 20px 0}
.sh{font-size:11px;color:var(--mute);letter-spacing:.14em;text-transform:uppercase;margin-bottom:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px 12px}
.card{cursor:pointer;min-width:0}
.card .img{aspect-ratio:3/4}
.card h3{font-size:13px;font-weight:400;margin:10px 0 3px;line-height:1.4}
.pr{font-size:13px;color:var(--mute)}
.foot{margin-top:72px;padding:22px 20px 28px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:11px;color:var(--mute)}
.tabs{display:flex;gap:26px;padding:18px 20px 14px;margin-bottom:22px;border-bottom:1px solid var(--line)}
.tabs button{font-size:13px;color:var(--mute);position:relative;padding-bottom:6px;transition:color .25s}
.tabs button.on{color:var(--ink)}
.tabs button::after{content:"";position:absolute;left:0;right:0;bottom:-15px;height:1px;background:var(--ink);transform:scaleX(0);transition:transform .3s}
.tabs button.on::after{transform:scaleX(1)}
#nav{
  position:relative !important;
  display:flex !important;
  flex:0 0 auto !important;
  flex-shrink:0 !important;
  width:100%;
  min-height:60px;
  left:auto;
  right:auto;
  bottom:auto;
  background:#F8F7F4 !important;
  border-top:1px solid #E8E7E3;
  padding:11px 0 calc(11px + env(safe-area-inset-bottom,0px));
  z-index:50;
  visibility:visible !important;
  opacity:1 !important;
}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;letter-spacing:.06em;color:var(--mute);position:relative;transition:color .25s}
nav button.on{color:var(--ink)}
.bdg{position:absolute;top:-4px;left:calc(50% + 4px);min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:var(--ink);color:var(--bg);font-size:9px;display:grid;place-items:center}
.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.4)}}
.ov{position:absolute;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;animation:up .45s cubic-bezier(.2,.7,.2,1);padding-top:env(safe-area-inset-top,0px)}
@keyframes up{from{transform:translateY(5%);opacity:0}to{transform:none;opacity:1}}
.ov .scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;position:relative}
.gal::-webkit-scrollbar{display:none}
.gal .img{flex:0 0 100%;scroll-snap-align:start;aspect-ratio:4/5}
.bk{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:16px;z-index:3;width:36px;height:36px;display:grid;place-items:center}
.cn{position:absolute;right:18px;top:calc(24px + env(safe-area-inset-top,0px));z-index:3;font-size:11px;color:var(--mute);letter-spacing:.06em}
.info{padding:22px 20px 28px}
.info h1{font-weight:400;font-size:20px;letter-spacing:-.01em}
.info .pr{font-size:15px;color:var(--ink);margin-top:5px}
.info p{font-size:13px;line-height:1.65;color:var(--mute);margin:18px 0 28px}
.lb{font-size:11px;color:var(--mute);letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px}
.sizes{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1;max-width:56px;min-width:44px;padding:11px 0;border:1px solid var(--line);font-size:12px;border-radius:2px;text-align:center;transition:all .2s}
.chip.on{border-color:var(--ink)}
.chip.x{color:#c8c7c2;text-decoration:line-through;cursor:not-allowed}
.cta{padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.item{display:flex;gap:16px;padding:20px 0;border-top:1px solid var(--line);animation:fade .4s}
.item .img{width:84px;aspect-ratio:3/4;flex:none}
.item .m{flex:1;min-width:0;display:flex;flex-direction:column}
.item h3{font-size:13px;font-weight:400;line-height:1.4}
.s{font-size:12px;color:var(--mute);margin-top:3px}
.qty{display:flex;align-items:center;gap:2px;font-size:13px}
.qty button{width:28px;height:28px;font-size:16px;color:var(--mute)}
.rm{font-size:11px;color:var(--mute);text-decoration:underline;text-underline-offset:3px}
.sum{border-top:1px solid var(--line);padding:20px 0;display:flex;justify-content:space-between;font-size:15px}
.f{display:block;margin-bottom:24px}
.f span{display:block;font-size:11px;color:var(--mute);margin-bottom:4px}
.f input{width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 0;font:inherit;font-size:15px;outline:0;border-radius:0;transition:border-color .2s}
.f input:focus{border-color:var(--ink)}
.opt{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
.opt:last-of-type{border-bottom:1px solid var(--line)}
.rad{width:14px;height:14px;border:1px solid var(--ink);border-radius:50%;position:relative}
.opt.on .rad::after{content:"";position:absolute;inset:3px;background:var(--ink);border-radius:50%;animation:fade .2s}
.empty{text-align:center;padding:110px 30px;color:var(--mute);font-size:13px;line-height:1.6}
.empty h2{font-weight:400;font-size:18px;color:var(--ink);margin-bottom:6px}
.empty .btn{display:inline-block;width:auto;padding:14px 32px;margin-top:26px}
.back{display:flex;align-items:center;gap:4px;font-size:13px;padding:18px 0 4px;cursor:pointer;color:var(--mute)}
@media(min-width:600px){body{padding:18px 0}.app{height:calc(100% - 36px);min-height:600px;border:1px solid #e4e3df}}
</style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app" id="app">
<div class="top"><div class="logo">blanks</div></div>
<main id="main"></main>
<nav id="nav"></nav>
</div>
<script>
'use strict';

const SUPABASE_URL = 'https://xoothvvwivglruepgbfu.supabase.co';
const SUPABASE_KEY = 'sb_publishable_SWdFCnd42rfPARIod8Q_QA_WDuEmEwU';

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const ICONS={
home:'<path d="M4 11l8-6.5 8 6.5v8.5H4z"/>',
shop:'<rect x="4" y="4" width="6.5" height="6.5"/><rect x="13.5" y="4" width="6.5" height="6.5"/><rect x="4" y="13.5" width="6.5" height="6.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5"/>',
bag:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8V6.5a3 3 0 016 0V8"/>',
back:'<path d="M15 5l-7 7 7 7"/>'
};

function icon(name){
return `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]||''}</svg>`;
}

const SHAPES={
tee:'M30 18L42 12Q50 20 58 12L70 18L88 36L78 46L70 40V104H30V40L22 46L12 36Z',
hood:'M30 20L40 14Q50 24 60 14L70 20L90 84L80 88L70 52V104H30V52L20 88L10 84Z M38 14Q50 0 62 14Q50 28 38 14Z',
sweat:'M30 18L42 12Q50 18 58 12L70 18L90 84L80 88L70 50V104H30V50L20 88L10 84Z',
pants:'M32 10H68L73 108H54L50 44L46 108H27Z',
shorts:'M30 26H70L76 74H55L50 50L45 74H24Z'
};

function productSvg(type,alternate=false){
const shape=SHAPES[type]||SHAPES.tee;
const fill=alternate?'#F1F0EC':'#F8F7F4';
return `<svg viewBox="0 0 100 116" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><path d="${shape}" fill="${fill}" stroke="#D9D8D3" stroke-width=".5" fill-rule="evenodd"/></svg>`;
}

const SIZES_TOP=['XS','S','M','L','XL'];
const SIZES_PANTS=['28','30','32','34'];

const DEMO_PRODUCTS=[
{id:1,name:'Футболка Heavy Cotton',group:'top',type:'tee',price:890,sizes:SIZES_TOP,unavailable:['XS'],popular:true,description:'Плотный хлопок 240 г/м², свободный крой, укреплённый ворот.'},
{id:2,name:'Худи Essential',group:'top',type:'hood',price:2290,sizes:SIZES_TOP,unavailable:['XS','S'],popular:true,description:'Футер с начёсом, двойной капюшон, спокойный силуэт.'},
{id:3,name:'Свитшот Crew',group:'top',type:'sweat',price:1890,sizes:SIZES_TOP,unavailable:['XL'],popular:true,description:'Классический свитшот без лишних деталей. Манжеты в рубчик.'},
{id:4,name:'Брюки Straight',group:'bottom',type:'pants',price:1790,sizes:SIZES_PANTS,unavailable:['28'],popular:true,description:'Прямые брюки из хлопкового твила, средняя посадка.'},
{id:5,name:'Футболка Boxy',group:'top',type:'tee',price:950,sizes:SIZES_TOP,unavailable:[],popular:false,description:'Укороченный boxy-крой, мягкая стирка.'},
{id:6,name:'Лонгслив Rib',group:'top',type:'sweat',price:1190,sizes:SIZES_TOP,unavailable:[],popular:false,description:'Тонкий хлопок в рубчик, длинный рукав.'},
{id:7,name:'Брюки Wide',group:'bottom',type:'pants',price:1690,sizes:SIZES_PANTS,unavailable:[],popular:false,description:'Широкие брюки из футера, пояс со шнуром.'},
{id:8,name:'Шорты Cotton',group:'bottom',type:'shorts',price:1090,sizes:SIZES_TOP,unavailable:['XS'],popular:false,description:'Лёгкие шорты из плотного хлопка до колена.'}
];
  let PRODUCTS = [...DEMO_PRODUCTS];

async function loadProductsFromSupabase(){
  try {
    const { data, error } = await supabaseClient
      .from('products')
      .select('*')
      .eq('is_active', true)
      .order('created_at', { ascending: false });

    if(error) throw error;

    if(!data || data.length === 0){
      console.log('Supabase: база товаров пока пустая');
      return;
    }

    PRODUCTS = data.map((item, index) => {
      const category = String(item.category || '').toLowerCase();

      return {
        id: item.id,
        name: item.name,
        group: ['bottom', 'низ', 'pants'].includes(category) ? 'bottom' : 'top',
        type: 'tee',
        price: Number(item.price),
        sizes: Array.isArray(item.sizes) && item.sizes.length ? item.sizes : SIZES_TOP,
        unavailable: [],
        popular: index < 4,
        description: item.description || '',
        images: item.images || []
      };
    });

    if(state.view === 'home' || state.view === 'catalog'){
      render();
    }

    console.log('Supabase: товары загружены', PRODUCTS.length);

  } catch(error) {
    console.error('Ошибка загрузки товаров:', error);
    PRODUCTS = [...DEMO_PRODUCTS];
  }
}

const state={view:'home',category:'all',cart:[],productId:null,selectedSize:null,orderComplete:false,delivery:0};

const $=selector=>document.querySelector(selector);
const money=value=>value.toLocaleString('uk-UA')+' ₴';
const getProduct=id=>PRODUCTS.find(product=>String(product.id)===String(id));
const cartCount=()=>state.cart.reduce((sum,item)=>sum+item.quantity,0);
const cartTotal=()=>state.cart.reduce((sum,item)=>{
const product=getProduct(item.id);
return sum+(product?product.price*item.quantity:0);
},0);

function go(view){
state.view=view;
state.productId=null;
$('.ov')?.remove();
render();
}

function render(keepScroll=false){
const view=state.view;
const navItems=[['home','Главная','home'],['catalog','Каталог','shop'],['cart','Корзина','bag']];

$('#nav').innerHTML=navItems.map(([key,label,iconName])=>{
const active=view===key||(view==='checkout'&&key==='cart');
const badge=key==='cart'&&cartCount()?`<span class="bdg" id="cartBadge">${cartCount()}</span>`:'';
return `<button class="${active?'on':''}" onclick="go('${key}')">${icon(iconName)}${label}${badge}</button>`;
}).join('');

const main=$('#main');
const oldScroll=main.scrollTop;
const pages={home:homePage,catalog:catalogPage,cart:cartPage,checkout:checkoutPage};
main.className=keepScroll?'':'fade';
main.innerHTML=(pages[view]||homePage)();
main.scrollTop=keepScroll?oldScroll:0;
}

function productCard(product){
  const image = Array.isArray(product.images) ? product.images[0] : '';

  const visual = image
    ? `<img src="${image}" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover;">`
    : productSvg(product.type);

  return `<div class="card" onclick='openProduct(${JSON.stringify(product.id)})'>
    <div class="img">${visual}</div>
    <h3>${product.name}</h3>
    <div class="pr">${money(product.price)}</div>
  </div>`;
}

function homePage(){
return `<div class="img hero">${productSvg('hood',true)}</div>
<div class="lead"><div><small>Коллекция</small><h1>Осень 2026</h1></div>
<button class="link" onclick="go('catalog')">Смотреть коллекцию</button></div>
<div class="sec"><div class="sh">Популярное</div>
<div class="grid">${PRODUCTS.filter(product=>product.popular).map(productCard).join('')}</div></div>
<div class="foot"><span>blanks © 2026</span><span>Украина</span></div>`;
}

function catalogPage(){
const filtered=PRODUCTS.filter(product=>state.category==='all'||product.group===state.category);
const tabs=[['all','Все'],['top','Верх'],['bottom','Низ']];
return `<div class="tabs">${tabs.map(([key,label])=>
`<button class="${state.category===key?'on':''}" onclick="setCategory('${key}')">${label}</button>`
).join('')}</div>
<div class="pad"><div class="grid">${filtered.map(productCard).join('')}</div></div>`;
}

function setCategory(category){
state.category=category;
render(true);
}

function cartPage(){
if(!state.cart.length)return `<div class="empty"><h2>Корзина пуста</h2>
Здесь появятся выбранные вещи<br><button class="btn" onclick="go('catalog')">В каталог</button></div>`;

const items=state.cart.map((item,index)=>{
const product=getProduct(item.id);
if(!product)return '';
return `<div class="item"><div class="img">${productSvg(product.type)}</div>
<div class="m"><h3>${product.name}</h3><div class="s">Размер ${item.size}</div>
<div class="pr" style="color:var(--ink);margin-top:3px">${money(product.price*item.quantity)}</div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:auto">
<div class="qty"><button onclick="changeQuantity(${index},-1)">−</button>
<span>${item.quantity}</span><button onclick="changeQuantity(${index},1)">+</button></div>
<button class="rm" onclick="removeCartItem(${index})">Удалить</button></div></div></div>`;
}).join('');

return `<div class="pad" style="padding-top:22px"><div class="sh">Корзина</div>
${items}<div class="sum"><span>Итого</span><span>${money(cartTotal())}</span></div>
<button class="btn" onclick="go('checkout')">Оформить заказ</button></div>`;
}

function changeQuantity(index,delta){
const item=state.cart[index];
if(!item)return;
item.quantity=Math.max(1,Math.min(9,item.quantity+delta));
render(true);
}

function removeCartItem(index){
state.cart.splice(index,1);
render(true);
}

function checkoutPage(){
if(state.orderComplete)return `<div class="empty"><h2>Заказ оформлен</h2>
Спасибо! Это демонстрационный режим — заказ пока никуда не отправляется.<br>
<button class="btn" onclick="finishOrder()">На главную</button></div>`;

const options=['Нова Пошта — отделение','Курьер'];
return `<div class="pad"><div class="back" onclick="go('cart')">${icon('back')} Корзина</div>
<div class="sh" style="margin:18px 0 22px">Оформление</div>
<label class="f"><span>Имя</span><input id="customerName" autocomplete="name" placeholder="Ваше имя" required></label>
<label class="f"><span>Телефон</span><input id="customerPhone" type="tel" autocomplete="tel" placeholder="+380" required></label>
<label class="f"><span>Город</span><input id="customerCity" autocomplete="address-level2" placeholder="Город доставки" required></label>
<div class="lb" style="margin-top:8px">Доставка</div>
${options.map((label,index)=>`<div class="opt ${state.delivery===index?'on':''}" onclick="selectDelivery(${index})"><span>${label}</span><div class="rad"></div></div>`).join('')}
<div class="sum" style="margin-top:8px"><span>К оплате</span><span>${money(cartTotal())}</span></div>
<button class="btn" onclick="submitDemoOrder()">Подтвердить заказ</button></div>`;
}

function selectDelivery(index){
state.delivery=index;
render(true);
}

function submitDemoOrder(){
const name=$('#customerName');
const phone=$('#customerPhone');
const city=$('#customerCity');
if(!name?.value.trim()||!phone?.value.trim()||!city?.value.trim()){
alert('Заполни имя, телефон и город доставки.');
return;
}
state.orderComplete=true;
render();
}

function finishOrder(){
state.cart=[];
state.orderComplete=false;
state.view='home';
render();
}

function openProduct(id){
state.productId=id;
state.selectedSize=null;
renderProductOverlay();
}

function renderProductOverlay(){
const product=getProduct(state.productId);
if(!product)return;
$('.ov')?.remove();

const images = Array.isArray(product.images) && product.images.length
  ? product.images
  : ['', '', ''];

const gallery = images.map((image, index) => `
  <div class="img">
    ${image
      ? `<img src="${image}" alt="${product.name}" loading="${index === 0 ? 'eager' : 'lazy'}" style="width:100%;height:100%;object-fit:cover;">`
      : productSvg(product.type, index === 1)
    }
  </div>
`).join('');
const sizeButtons=product.sizes.map(size=>{
const unavailable=product.unavailable.includes(size);
const selected=state.selectedSize===size;
return `<button class="chip ${selected?'on':''} ${unavailable?'x':''}" ${unavailable?'disabled':''} onclick="selectSize('${size}')">${size}</button>`;
}).join('');

$('#app').insertAdjacentHTML('beforeend',`<div class="ov"><div class="scroll">
<button class="bk" onclick="closeProduct()">${icon('back')}</button>
<span class="cn" id="galleryCounter">1 / 3</span>
<div class="gal" onscroll="updateGalleryCounter(this)">${gallery}</div>
<div class="info"><h1>${product.name}</h1><div class="pr">${money(product.price)}</div>
<p>${product.description}</p><div class="lb">Размер</div><div class="sizes">${sizeButtons}</div></div>
</div><div class="cta"><button class="btn" id="addButton" onclick="addToCart()">Добавить в корзину</button></div></div>`);
}

function updateGalleryCounter(gallery){
  const counter = $('#galleryCounter');
  if(!counter) return;

  const total = gallery.children.length;
  const current = Math.round(gallery.scrollLeft / gallery.clientWidth) + 1;

  counter.textContent = `${current} / ${total}`;
}

function selectSize(size){
state.selectedSize=size;
renderProductOverlay();
}

function closeProduct(){
$('.ov')?.remove();
state.productId=null;
}

function addToCart(){
const product=getProduct(state.productId);
const button=$('#addButton');
if(!product||!button)return;

if(!state.selectedSize){
button.textContent='Выберите размер';
setTimeout(()=>{
const current=$('#addButton');
if(current)current.textContent='Добавить в корзину';
},1200);
return;
}

const existing=state.cart.find(item=>item.id===product.id&&item.size===state.selectedSize);
if(existing)existing.quantity=Math.min(9,existing.quantity+1);
else state.cart.push({id:product.id,size:state.selectedSize,quantity:1});

render(true);
$('#cartBadge')?.classList.add('bump');
button.textContent='Добавлено';
setTimeout(()=>{
const current=$('#addButton');
if(current)current.textContent='Добавить в корзину';
},1400);
}

const tg = window.Telegram?.WebApp;

if (tg) {
  tg.ready();
  tg.expand();

  const updateAppHeight = () => {
    const height = tg.viewportStableHeight || tg.viewportHeight;

    if (height) {
      document.querySelector('.app').style.height = `${height}px`;
    }
  };

  updateAppHeight();

  tg.onEvent('viewportChanged', (event) => {
    if (event.isStateStable) {
      updateAppHeight();
    }
  });
}

render();
loadProductsFromSupabase();
